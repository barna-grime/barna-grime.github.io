<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barna Grime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0d;--panel:#16181a;--edge:#2a2e32;--ink:#ece8dd;--dim:#8d9296;--led:#3dff7a;--amber:#ffb000;--red:#ff3b3b;--cyan:#33d6ff;--tape:#efe6c8;
--head:'Anton',Impact,sans-serif;--mono:'Share Tech Mono',ui-monospace,monospace;--marker:'Permanent Marker',cursive;--body:'Space Grotesk',system-ui,sans-serif;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
body{background-image:radial-gradient(circle at 15% -10%,#1d2420 0,transparent 55%),radial-gradient(circle at 110% 110%,#24130f 0,transparent 50%)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
/* top */
.top{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px}
.topr{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--head);letter-spacing:.05em;font-size:1rem}.brand b{color:var(--red);font-weight:400}
.chap{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.segs{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.segs i{height:4px;border-radius:2px;background:#24282c;overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;width:0;background:var(--led);transition:width .4s}
.segs i.cur b{background:var(--amber)}
/* stage */
.stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding:14px 20px 30px;opacity:0;transform:translateX(30px);transition:opacity .35s,transform .35s;pointer-events:none;-webkit-overflow-scrolling:touch}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.out{transform:translateX(-30px)}
.inner{max-width:640px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:.75rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
h1,h2{font-family:var(--head);font-weight:400;text-transform:uppercase;line-height:1.02;margin:.15em 0 .45em;letter-spacing:.01em}
h1{font-size:clamp(3rem,15vw,6rem)} h2{font-size:clamp(2rem,9vw,3.4rem)}
h1 span,h2 span{color:var(--red)}
p{font-size:1.08rem;line-height:1.5;margin:.5em 0}
.f{opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s;visibility:hidden}
.f.v{opacity:1;transform:none;visibility:visible}
.big{font-family:var(--head);text-transform:uppercase;font-size:clamp(1.6rem,7vw,2.5rem);line-height:1.08;margin:18px 0;padding:14px 16px;border-left:4px solid var(--red);background:#140b0a}
.tape{display:inline-block;background:var(--tape);color:#151515;font-family:var(--marker);padding:3px 10px 1px;transform:rotate(-1.5deg);box-shadow:0 2px 5px #0009;font-size:1rem;margin:4px 0 8px}
.tape.a{background:#ffd36b}.tape.g{background:#9dff9f}.tape.r{background:#ff7d6e}
.dim{color:var(--dim)} .small{font-size:.9rem}
.card{background:linear-gradient(180deg,#1d2023,#141618);border:1px solid var(--edge);border-radius:12px;padding:14px;margin:12px 0}
.hl{color:var(--amber)}
.cover{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.freq{font-family:var(--mono);color:var(--amber);font-size:.8rem;letter-spacing:.2em}
/* bottom */
.bot{display:flex;gap:8px;padding:10px 14px calc(10px + var(--sb));border-top:1px solid var(--edge);background:#0d0e0f}
.nb{border:1px solid #000;border-radius:10px;padding:14px 16px;background:linear-gradient(180deg,#34393e,#22262a);box-shadow:0 2px 0 #000;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;font-size:.9rem}
.nb:active{transform:translateY(2px);box-shadow:none}
.nb.go{flex:1;background:linear-gradient(180deg,#ffc93d,#d48a00);color:#1b1100;font-weight:700;font-size:1rem}
.nb.go.next{background:linear-gradient(180deg,#2bd162,#169443);color:#02140a}
.nb[disabled]{opacity:.35}
.hintdots{display:flex;gap:4px;justify-content:center;margin-top:3px}
.hintdots i{width:5px;height:5px;border-radius:50%;background:#00000055}.hintdots i.v{background:#000}
/* index */
.idx{position:fixed;inset:0;z-index:20;background:#000d;display:none;padding:calc(14px + var(--st)) 14px calc(14px + var(--sb))}
.idx.open{display:block}
.idx .in{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--edge);border-radius:14px;max-height:100%;overflow:auto;padding:14px}
.idx a{display:flex;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid #23272b;color:var(--ink);text-decoration:none}
.idx a .n{font-family:var(--head);font-size:1.4rem;color:var(--amber);width:34px}
.idx a.lock{opacity:.35;pointer-events:none}.idx a.lock .n{color:var(--dim)}
.idx a .s{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--dim)}
/* widgets */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--edge);background:#131517;border-radius:999px;padding:9px 13px;font-size:.95rem}
.chip.on{background:var(--amber);color:#111;border-color:var(--amber)}
.chip.ok{background:#123b20;border-color:var(--led)} .chip.no{text-decoration:line-through;opacity:.45}
.reveal{min-height:3.2em;margin-top:6px;padding:12px;border-radius:10px;background:#0e1011;border:1px dashed var(--edge);font-size:1rem;line-height:1.45}
.count{font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.roots{position:relative;height:300px;margin:6px 0}
.roots .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:1.3rem;box-shadow:0 0 30px #ff3b3b66}
.roots .chip{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:.85rem;padding:8px 11px}
.roots svg{position:absolute;inset:0;width:100%;height:100%}
.flip{perspective:900px;margin:10px 0;cursor:pointer}
.flip .fi{position:relative;min-height:110px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--edge)}
.flip .fa{background:#17191b}.flip .fa:after{content:"toca para girar ↻";font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:8px}
.flip .fb{transform:rotateY(180deg);background:#0f1a12;border-color:#24563a}
.flip .fb.myth{background:#1d0f0d;border-color:#5c2018}
.flip .lbl{font-family:var(--head);font-size:1.2rem;letter-spacing:.04em}
.flip .fb .lbl{color:var(--led)} .flip .fb.myth .lbl{color:var(--red)}
.pulses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pulse{background:#0d0f10;border:1px solid var(--edge);border-radius:12px;padding:14px;text-align:center}
.pulse .dot{width:58px;height:58px;border-radius:50%;margin:6px auto 10px;background:#2a1c00;animation:beat var(--d,.4286s) infinite}
.pulse.l .dot{background:#00242c;--c:var(--cyan)}
.pulse .n{font-family:var(--head);font-size:2.2rem;line-height:1}
@keyframes beat{0%{background:var(--c,var(--amber));box-shadow:0 0 26px var(--c,var(--amber));transform:scale(1.08)}35%{background:#1b1b1b;box-shadow:none;transform:scale(1)}100%{background:#1b1b1b}}
input[type=range]{width:100%;accent-color:var(--amber);height:34px}
.lcd{font-family:var(--mono);background:#071108;color:var(--led);border:1px solid #1d3a22;border-radius:6px;padding:4px 10px;display:inline-block;text-shadow:0 0 6px #3dff7a88}
.grid16{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0}
.grid16 i{aspect-ratio:1/1.6;border-radius:3px;background:#1a1d20}
.grid16 i.k{background:var(--red)}.grid16 i.s{background:var(--amber)}.grid16 i.h{background:#3c4248}
.grid16 i.q{box-shadow:inset 0 -3px 0 #ffffff44}
.legend{display:flex;gap:12px;font-family:var(--mono);font-size:.72rem;color:var(--dim);flex-wrap:wrap}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.seg2{display:flex;gap:6px;margin:8px 0}.seg2 button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--edge);background:#131517;font-family:var(--mono);font-size:.8rem;text-transform:uppercase}
.seg2 button.on{background:var(--ink);color:#111}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.journey div{border-radius:10px;padding:12px 8px;text-align:center;font-family:var(--head);font-size:1rem;text-transform:uppercase;background:#16191c;border:1px solid var(--edge)}
.mcline{height:30px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--led) 0 14px,#0000 14px 22px);opacity:1;transition:opacity .4s;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;color:#000;font-weight:700}
.mcline.off{opacity:.08}
.meter{height:14px;border-radius:7px;background:#111;border:1px solid #000;overflow:hidden;margin:6px 0}
.meter b{display:block;height:100%;background:linear-gradient(90deg,var(--led),var(--amber) 70%,var(--red));transition:width .5s}
.opt{display:block;width:100%;text-align:left;padding:13px;border-radius:10px;border:1px solid var(--edge);background:#131517;margin:8px 0;font-size:1rem}
.opt.ok{border-color:var(--led);background:#0d1a10}.opt.mid{border-color:var(--amber);background:#1a1508}.opt.no{border-color:var(--red);background:#1a0d0c}
.dial{background:linear-gradient(180deg,#2a2218,#17120c);border:1px solid #3a2f20;border-radius:14px;padding:14px}
.dial .scale{position:relative;height:42px;border-radius:6px;background:#0c0a07;border:1px solid #000;overflow:hidden;margin:8px 0}
.dial .scale span{position:absolute;bottom:3px;font-family:var(--mono);font-size:.62rem;color:#9b8a6a;transform:translateX(-50%)}
.dial .scale i{position:absolute;top:0;width:1px;height:12px;background:#6d5f45}
.dial .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 8px var(--red);transform:translateX(-50%)}
.dial .screen{min-height:120px;border-radius:8px;background:#060504;border:1px solid #000;padding:12px;font-size:.98rem;line-height:1.45;position:relative;overflow:hidden}
.dial .screen.static:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff10 0 1px,#0000 1px 3px);animation:st .15s steps(2) infinite}
@keyframes st{50%{transform:translateY(2px)}}
.dial .freq{display:flex;justify-content:space-between;align-items:center}
.bars64{display:grid;grid-template-columns:repeat(16,1fr);gap:2px;margin:10px 0}
.bars64 i{height:12px;border-radius:2px;background:#1c1f22}
.bars64 i.a{background:#174a5a}.bars64 i.b{background:#5a3f0a}.bars64 i.c{background:#5a1a12}.bars64 i.d{background:#2d4a17}
.train{position:relative;height:90px;border-radius:12px;background:#0d0f10;border:1px solid var(--edge);overflow:hidden;margin:10px 0}
.train .rail{position:absolute;left:0;right:0;bottom:16px;height:3px;background:#333}
.train .cars{position:absolute;bottom:20px;left:0;display:flex;gap:6px;animation:roll 6s linear infinite;width:max-content}
.train .car{width:80px;height:38px;border-radius:6px;font-family:var(--mono);font-size:.62rem;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.train .rider{position:absolute;top:8px;font-size:1.3rem;transition:left .5s}
.mics{display:flex;justify-content:center;gap:4px;font-size:2rem;min-height:52px;align-items:center;margin:8px 0}
.mics span{animation:pop .35s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:9px;border:1px solid #000;background:linear-gradient(180deg,#34393e,#22262a);box-shadow:0 2px 0 #000;font-family:var(--mono);font-size:.85rem;text-transform:uppercase}
.btn.a{background:linear-gradient(180deg,#ffc93d,#d48a00);color:#1b1100}.btn.r{background:linear-gradient(180deg,#ff5a4a,#c42417);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.echo{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:10px 0;border-radius:12px;background:#0d0f10;border:1px solid var(--edge);padding:10px;text-align:center}
.echo .l{font-family:var(--head);text-transform:uppercase;animation:pop .3s}
.echo .l.mc{color:var(--amber);font-size:1.4rem}.echo .l.cr{color:var(--led);font-size:1.1rem;opacity:.85}
input.txt{width:100%;padding:12px;border-radius:10px;border:1px solid var(--edge);background:#0c0d0e;color:var(--ink);font:inherit;font-size:1rem}
.sea{position:relative;height:150px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#0b1a24,#0b0c0d);border:1px solid var(--edge);margin:10px 0}
.sea .water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#1f6f8f,#0b3448);transition:height .35s}
.sea .water:before{content:"";position:absolute;top:-8px;left:0;right:0;height:16px;background:radial-gradient(circle at 10px 16px,#1f6f8f 9px,#0000 10px) 0 0/20px 16px repeat-x}
.sea .wave{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:3rem;color:#fff;text-shadow:0 0 20px var(--cyan);opacity:0;transition:opacity .2s}
.sea.hit .wave{opacity:1}.sea.hit .water{height:100%!important;background:linear-gradient(180deg,#5fd3ff,#1f6f8f)}
.signals{display:grid;gap:6px;margin:8px 0}
.signals div{padding:9px 12px;border-radius:8px;background:#131517;border:1px solid var(--edge);color:#555;font-size:.92rem;transition:all .3s}
.signals div.on{color:var(--ink);border-color:var(--amber);background:#1a1508}
.types{display:grid;gap:8px;margin:10px 0}
.types .card{margin:0}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin:14px 0;font-family:var(--head);font-size:1.3rem;text-transform:uppercase}
.eq .t{padding:10px 12px;border-radius:10px;border:1px dashed var(--edge);color:#555;transition:all .3s}
.eq .t.on{border-style:solid;border-color:var(--amber);color:var(--ink);background:#1a1508}
.eq .op{color:var(--dim)}
.check{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--edge);background:#131517;margin:6px 0;width:100%;text-align:left;font-size:1rem}
.check i{width:22px;height:22px;border-radius:6px;border:2px solid var(--dim);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.9rem}
.check.on{border-color:#24563a;background:#0f1a12}.check.on i{background:var(--led);border-color:var(--led);color:#000}
.quote{font-family:var(--marker);font-size:1.5rem;line-height:1.25;color:var(--tape);transform:rotate(-1deg);margin:16px 0}
.toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translate(-50%,-10px);opacity:0;z-index:30;padding:9px 14px;border-radius:8px;background:#000;border:1px solid var(--led);color:var(--led);font-family:var(--head);font-size:1.15rem;text-transform:uppercase;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.term{border-bottom:1px dashed var(--amber);cursor:help}
.gbtn{position:fixed;right:14px;bottom:calc(86px + var(--sb));z-index:15;width:50px;height:50px;border-radius:50%;border:2px solid #000;background:var(--tape);color:#111;font-family:var(--marker);font-size:1.3rem;box-shadow:0 4px 12px #000a}
.drawer{position:fixed;inset:0;z-index:25;background:#000b;display:none}.drawer.open{display:block}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--edge);overflow:auto;padding:calc(14px + var(--st)) 16px calc(24px + var(--sb))}
.gsearch{width:100%;padding:11px;border-radius:9px;border:1px solid var(--edge);background:#0c0d0e;color:var(--ink);font:inherit;margin:8px 0 6px}
.gterm{padding:11px 0;border-bottom:1px solid #23272b}.gterm h4{margin:0;font-family:var(--head);font-weight:400;font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase}
.gterm h4 em{font-family:var(--mono);font-style:normal;font-size:.72rem;color:var(--dim);text-transform:none;margin-left:6px}.gterm p{margin:4px 0;font-size:.95rem}
.gterm.hit{background:#1a1508;border-radius:8px;padding-left:8px;padding-right:8px}
@media(min-width:800px){.slide{padding-top:30px}}
</style></head>
<body>
<div id="app">
  <header class="top"><div class="topr"><span class="brand">BARNA <b>GRIME</b></span><span class="chap" id="chap"></span></div><div class="segs" id="segs"></div></header>
  <main class="stage" id="stage"></main>
  <nav class="bot"><button class="nb" id="prev" aria-label="Atrás">◂</button><button class="nb" id="index">Índice</button><button class="nb go" id="next"><span id="nextl">Descubrir</span><div class="hintdots" id="dots"></div></button></nav>
</div>
<div class="idx" id="idx"><div class="in"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:2rem">Índice</h2><button class="btn" id="idxc">✕</button></div><p class="small dim">Los capítulos se desbloquean a medida que avanzas.</p><div id="idxl"></div></div></div>
<button class="gbtn" id="gbtn" aria-label="Glosario">G</button>
<div class="drawer" id="drawer"><div class="in"><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:2rem">Glosario</h2><button class="btn" id="gclose">✕</button></div>
<input class="gsearch" id="gq" placeholder="Buscar término…"><div id="glist"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ CONTENIDO ============
   Cada slide: ch (capítulo 0-14), html. Los elementos con class="f" se descubren uno a uno.
   data-w="nombre" monta un widget interactivo. */
const CH=['Inicio','Orígenes y contexto','La base: 140 BPM','El sonido','Los MCs','La radio','Los DJs','Las bases no paran','No necesariamente improvisan','Los hooks','El drop','El pullup','Los sets','Deporte y pasión','Carrera y forma de vida'];
const S=[
{ch:0,html:`<div class="cover"><div class="freq">▮▮▮ BCN · 140 · ON AIR</div><h1>Barna<br><span>Grime</span></h1>
 <p class="dim">Una introducción a la cultura, sus códigos y sus formas de expresión.</p>
 <p class="f">14 claves para entrar en un set. No se leen de golpe: <b class="hl">se descubren</b>.</p>
 <p class="f small dim">Pulsa el botón amarillo para ir revelando. Algunas pantallas tienen cosas que tocar.</p></div>`},

/* 1 ORÍGENES */
{ch:1,html:`<div class="kicker">01 · Orígenes y contexto</div><h2>Este de <span>Londres</span></h2>
 <p class="f">Finales de los 90, principios de los 2000.</p>
 <p class="f">Un espacio de expresión para las juventudes de los barrios populares, especialmente las comunidades <b>afrodescendientes y afrocaribeñas</b> de la ciudad.</p>
 <p class="f">Una herramienta para expresar <b class="hl">rabia, frustración, identidad</b>… y liberar energía a través de la música y la palabra.</p>`},
{ch:1,html:`<div class="kicker">01 · Orígenes y contexto</div><h2>Las <span>raíces</span></h2>
 <p class="small dim">Toca cada raíz para ver qué aporta.</p><div data-w="roots"></div>
 <div class="f card"><p style="margin:0">El grime no nace de una única tradición: es el <b>encuentro</b> de culturas, sonidos y realidades. La diáspora africana y caribeña en el contexto británico tiene un papel fundamental.</p></div>`},
{ch:1,html:`<div class="kicker">01 · Orígenes y contexto</div><h2>El grime <span>hoy</span></h2>
 <p class="f">Un <b>sonido</b>, un <b>espacio</b> y una <b>plataforma</b> de expresión.</p>
 <p class="f">Los DJs mezclan <span class="term" data-t="Deep dubstep">deep dubstep</span>, <span class="term" data-t="2-step">2-step</span> o funk brasileño. Los MCs vienen de realidades y tradiciones muy diversas.</p>
 <p class="f">Muchas reglas iniciales se han transformado. Eso ha permitido cuestionar códigos conservadores, como ciertas expresiones de <b>masculinidad tóxica</b>, y abrir espacio a nuevas identidades y discursos.</p>
 <div class="f big">No es solo un sonido: es una forma de ocupar un espacio y expresarse dentro de él.</div>`},

/* 2 BPM */
{ch:2,html:`<div class="kicker">02 · La base</div><h2>140 <span>BPM</span></h2>
 <p class="f">Históricamente, el grime se ha desarrollado alrededor de los <b>140 BPM</b>: una de sus señas de identidad.</p>
 <p class="f">También se usan bases a <b>70 BPM</b>, la mitad exacta. Encajan con la misma sensación rítmica.</p>
 <div class="f" data-w="bpm"></div>`},
{ch:2,html:`<div class="kicker">02 · La base</div><h2>Una <span>referencia</span>, no una frontera</h2>
 <p class="f">Algunas bases se aceleran o se ralentizan para adaptarse a la sesión y mezclarse con otros géneros.</p>
 <div class="f" data-w="tempo"></div>
 <p class="f">Más allá del número, lo importante es la relación entre el <b>tempo</b>, el <b>ritmo</b> y cómo el MC <b>coloca su voz</b>.</p>`},

/* 3 SONIDO */
{ch:3,html:`<div class="kicker">03 · El sonido</div><h2>Roto y <span>contundente</span></h2>
 <p class="f">Patrones sincopados · bajos potentes · sintetizadores agresivos · sonoridad áspera o saturada.</p>
 <p class="f">La métrica suele ser un 4/4 regular, pero los patrones juegan con los <b>acentos</b>, los <b>silencios</b> y los <b>desplazamientos</b>. Compara:</p>
 <div class="f" data-w="steps"></div>`},
{ch:3,html:`<div class="kicker">03 · El sonido</div><h2>¿Qué hace que un set <span>sea grime</span>?</h2>
 <p class="f">Como <b>performance</b>, la definición se amplía. No hay una lista cerrada de instrumentales permitidos.</p>
 <div class="f" data-w="journey"></div>
 <div class="f big">La continuidad la ponen sobre todo los MCs: su presencia y su manera de actuar.</div>`},

/* 4 MCs */
{ch:4,html:`<div class="kicker">04 · Los MCs</div><h2>El MC es <span>personalidad</span></h2>
 <p class="f">Desde artistas que llegaron al mainstream internacional, como <b>Skepta</b>…</p>
 <p class="f">…hasta MCs legendarios que nunca publicaron una canción comercial y cuya historia sobrevive en grabaciones de radio y fragmentos de sets.</p>
 <p class="f">Sus barras circulaban entre jóvenes por CDs, teléfonos y archivos compartidos. Muchos se hicieron leyenda sin perseguir la fama.</p>
 <p class="f">El grime no existiría sin sus MCs: no tanto por sus canciones, sino por las <b class="hl">personalidades</b> que hacían explotar cada sesión.</p>`},
{ch:4,html:`<div class="kicker">04 · Los MCs</div><h2>¿Qué <span>cumple</span> su cometido?</h2>
 <p class="small dim">Tres intervenciones en un set. ¿Cuál vale?</p><div data-w="mcpick"></div>
 <p class="f">La técnica importa, pero <b>no es el único criterio</b>.</p>
 <div class="f big">Generar momentos memorables puede valer más que cualquier virtuosismo.</div>`},

/* 5 RADIO */
{ch:5,html:`<div class="kicker">05 · La radio</div><h2>Donde el grime <span>vive</span></h2>
 <p class="f">En los <b><span class="term" data-t="Radio set">radio sets</span></b> se ve con claridad su naturaleza colectiva y espontánea.</p>
 <p class="f">Para muchos MCs, hacer carrera es estar constantemente en sesiones de radio: ahí se demuestra la constancia, se perfeccionan habilidades y se construye <b>reputación</b>.</p>
 <p class="f">Muchas canciones nacen de barras o hooks que conectaron tanto en un set que acabaron siendo temas propios.</p>
 <p class="f">Y a veces la versión en directo es <b class="hl">más legendaria</b> que la grabada: hay fans que recuerdan sets concretos con barras que nunca se publicaron.</p>`},
{ch:5,html:`<div class="kicker">05 · La radio</div><h2>Mueve el <span>dial</span></h2>
 <p class="small dim">Desliza para sintonizar cada época.</p><div data-w="dial"></div>
 <div class="f big">Más que un medio: una institución cultural.</div>`},

/* 6 DJs */
{ch:6,html:`<div class="kicker">06 · Los DJs</div><h2>¿Mito o <span>realidad</span>?</h2>
 <div data-w="flips6"></div>
 <p class="f">Su trabajo: mantener el ritmo de la sesión, seleccionar instrumentales, gestionar transiciones y <b>leer constantemente a los MCs</b>.</p>
 <p class="f">Muchos tienen <b><span class="term" data-t="Residencia">residencias</span></b> en emisoras, donde organizan sesiones periódicas e invitan a distintos MCs.</p>`},
{ch:6,html:`<div class="kicker">06 · Los DJs</div><h2>Cada cuánto <span>cambia</span> el beat</h2>
 <p class="f">Muchos sets cambian de instrumental cada 16, 32 o 64 barras, aunque no hay una regla universal.</p>
 <div class="f" data-w="bars"></div>
 <p class="f">Ahora ponte en su lugar:</p><div class="f" data-w="dj"></div>
 <div class="f big">Un buen DJ no pone música: construye una sesión.</div>`},

/* 7 BASES NO PARAN */
{ch:7,html:`<div class="kicker">07 · Las bases no paran</div><h2>Un tren <span>en marcha</span></h2>
 <p class="f">Los instrumentales no se detienen entre intervenciones. El DJ mete beats nuevos sin perder el compás y los MCs van rotando encima.</p>
 <p class="f">Los MCs se pasan el micro (<span class="term" data-t="Pass the mic">pass the mic</span>)… o se lo disputan amistosamente para pillar un beat antes de que cambie.</p>
 <div class="f" data-w="train"></div>`},
{ch:7,html:`<div class="kicker">07 · Las bases no paran</div><h2>La energía <span>sube</span></h2>
 <p class="f">A medida que avanza el set, se suman MCs, se comparte el espacio vocal y crece la intensidad.</p>
 <div class="f" data-w="mics"></div>
 <div class="f big">No se espera a que termine una canción. Se aprende a entrar en una sesión que ya está en movimiento.</div>`},

/* 8 IMPROVISACIÓN */
{ch:8,html:`<div class="kicker">08 · Improvisación</div><h2>No es una <span>batalla de gallos</span></h2>
 <p class="f">Por la tradición del rap en España y la popularidad de las batallas, se tiende a pensar que los MCs de grime improvisan todo el tiempo.</p>
 <p class="f"><b class="hl">En realidad, no suele ser así.</b> Gira las cartas:</p>
 <div class="f" data-w="flips8"></div>`},
{ch:8,html:`<div class="kicker">08 · Improvisación</div><h2>Improvisar <span>también</span> es…</h2>
 <p class="small dim">Toca cada forma de improvisar.</p><div data-w="impro"></div>
 <p class="f">La dificultad: que tus letras funcionen sobre instrumentales distintos, sin saber cuál será el siguiente beat.</p>
 <div class="f big">La habilidad no está en inventar palabras, sino en saber cuándo, cómo y dónde usarlas.</div>`},

/* 9 HOOKS */
{ch:9,html:`<div class="kicker">09 · Los hooks</div><h2>Fácil, directo, <span>pegadizo</span></h2>
 <p class="f">Frases o fragmentos vocales que se repiten para conectar con el público y generar <b>participación colectiva</b>.</p>
 <p class="f">Pueden ser de una canción del MC o inventarse en el momento. Una frase, una palabra, una <span class="term" data-t="Chant">consigna</span>… o una combinación de sonidos.</p>
 <p class="f">Crea el tuyo:</p><div class="f" data-w="hook"></div>`},
{ch:9,html:`<div class="kicker">09 · Los hooks</div><h2>¿Para qué <span>sirve</span>?</h2>
 <p class="small dim">Descubre sus seis funciones.</p><div data-w="hookfn"></div>
 <div class="f big">A veces, cuatro palabras en el momento justo generan más energía que dieciséis barras complejas.</div>`},

/* 10 DROP */
{ch:10,html:`<div class="kicker">10 · El drop</div><h2>El momento de <span>impacto</span></h2>
 <p class="f">En una canción, el artista tiene su entrada estructurada. En un set, el MC tiene que <b>escuchar constantemente</b> para detectar cuándo llega.</p>
 <p class="f">Contar compases mientras rapeas y compartes micro es complicado. Por eso los MCs desarrollan una escucha que reconoce los cambios <b>sin contar</b>.</p>
 <p class="f quote">“Como ver cómo se retira el mar antes de un tsunami.”</p>`},
{ch:10,html:`<div class="kicker">10 · El drop</div><h2>Lee las <span>señales</span></h2>
 <p class="small dim">Arrastra hacia el drop.</p><div data-w="sea"></div>
 <p class="f">Reconocerlas te permite preparar la entrada, recuperar un hook o soltar las barras justo en el punto de máximo impacto.</p>
 <div class="f big">Dominar estas señales distingue a un MC experimentado.</div>`},

/* 11 PULLUP */
{ch:11,html:`<div class="kicker">11 · El pullup</div><h2>¡Pull <span>up</span>!</h2><p class="small dim">También lo oirás como <span class="term" data-t="Wheel up">wheel up</span> o rewind.</p>
 <p class="f">El DJ devuelve el instrumental a un punto anterior, normalmente al principio, para repetir un momento que ha provocado una reacción especialmente fuerte.</p>
 <p class="f">No se consigue rapeando más rápido ni con estructuras más complejas.</p>
 <p class="f">Se consigue provocando una reacción que haga que el público, los MCs o el propio DJ quieran <b class="hl">volver a escucharlo</b>.</p>`},
{ch:11,html:`<div class="kicker">11 · El pullup</div><h2>Tres <span>tipos</span></h2>
 <div class="types">
  <div class="f card"><span class="tape a">General</span><p style="margin:0">Público, MCs y DJ reaccionan a la vez y piden que se repita. De los momentos más enérgicos de una sesión.</p></div>
  <div class="f card"><span class="tape g">De MCs</span><p style="margin:0">Los otros MCs reconocen una intervención potente y piden al DJ que la vuelva a poner. Reconocimiento entre artistas.</p></div>
  <div class="f card"><span class="tape r">De DJ</span><p style="margin:0">El DJ repite el momento sin que nadie lo pida. Aprecio directo hacia el MC.</p></div>
 </div>
 <p class="f">Los dos últimos se aprecian especialmente en los radio sets. ¿Sabrías distinguirlos?</p>
 <div class="f" data-w="pullup"></div>
 <div class="f big">El pullup no es una repetición: es reconocimiento cultural.</div>`},

/* 12 SETS */
{ch:12,html:`<div class="kicker">12 · Los sets</div><h2>¿Qué es un <span>set</span>?</h2>
 <p class="small dim">Toca cada pieza.</p><div data-w="eq"></div>
 <p class="f">Puede pasar en una emisora, una sala, un evento… en cualquier espacio donde se dé esta interacción musical.</p>
 <p class="f">Los sets grabados capturan parte de esa energía y algunos se han vuelto legendarios. Pero nada sustituye a estar ahí.</p>
 <div class="f big">Espontaneidad, química, personalidad y contexto.</div>
 <p class="f">No depende solo de lo que suena, sino de quién está a los platos, quién tiene el micro y <b>qué pasa entre ellos</b>.</p>`},

/* 13 DEPORTE */
{ch:13,html:`<div class="kicker">13 · Deporte y pasión</div><h2>El grime es un <span>deporte</span></h2>
 <p class="f">Así lo define el DJ <b>DNDY</b>, de Skeen. Basta ver a los MCs sudando y dejándose el alma en una sesión para entenderlo.</p>
 <p class="f">Como en el deporte: dedicación, constancia y <b>entrenamiento</b>. Tu plan:</p>
 <div class="f" data-w="train13"></div>
 <p class="f quote">Nadie nace siendo el mejor.</p>
 <div class="f big">No basta con escribir buenas barras: hay que entrenar la capacidad de interpretarlas.</div>`},

/* 14 CARRERA */
{ch:14,html:`<div class="kicker">14 · Carrera y forma de vida</div><h2>Never Gonna Make <span>a Million</span></h2>
 <p class="f">Algunos artistas del grime han llegado al mainstream y han hecho carreras comerciales importantes.</p>
 <p class="f">Pero el título de <b>Lethal Bizzle</b> resume una actitud de la escena: no entrar en el grime pensando que es una vía rápida para hacerse rico.</p>
 <p class="f">Se ha vivido como expresión impulsada por la <b>pasión</b>, la <b>comunidad</b> y la necesidad de tener un <b>espacio propio</b>.</p>
 <p class="f">Se puede construir una carrera y ganar dinero, pero su valor cultural <b class="hl">no depende</b> de su potencial económico.</p>`},
{ch:14,html:`<div class="kicker">14 · Carrera y forma de vida</div><h2>¿Qué te da <span>valor</span> en un set?</h2>
 <p class="small dim">Toca lo que de verdad cuenta.</p><div data-w="values"></div>
 <p class="f">Un artista consolidado puede respetar enormemente a otro que nunca ha publicado una canción.</p>
 <div class="f big">La comunidad sigue siendo fundamental.</div>`},
{ch:14,html:`<div class="cover"><div class="freq">▮▮▮ FIN DE LA EMISIÓN</div><h1>Ahora <span>te toca</span></h1>
 <p class="f quote">El grime se construye participando en él.</p>
 <p class="f">No basta con consumirlo: hay que formar parte de él. Busca sets, escucha radio, ve a sesiones, entrena… y coge el micro.</p>
 <div class="f row" style="margin-top:14px"><button class="btn a" onclick="go(0)">↺ Volver a empezar</button><button class="btn" onclick="openIdx()">Índice</button></div></div>`}
];

/* ============ GLOSARIO ============ */
const G=[
 ['Set','sesión','Sesión en la que un DJ pincha y varios MCs van entrando y saliendo sobre los instrumentales. Se define por el espacio, los DJs y los MCs.'],
 ['Radio set','set de radio','Set emitido desde una emisora. Es donde mejor se ve la naturaleza colectiva y espontánea del grime.'],
 ['Radio pirata','pirate radio','Emisoras sin licencia, a menudo desde azoteas y pisos. Fueron clave para que DJs y MCs llegaran al público sin la industria.'],
 ['Residencia','residency','Sesión periódica que un DJ tiene en una emisora, donde invita a distintos MCs.'],
 ['MC','Master of Ceremonies','En grime no solo rapea: es personalidad, energía y conexión con el público.'],
 ['Riddim','instrumental','El instrumental o beat. Palabra que viene de la cultura jamaicana.'],
 ['Bars','barras','Las líneas de una letra. "Tener barras" es tener letras con impacto.'],
 ['Hook','gancho','Frase o fragmento corto y pegadizo que se repite para que el público participe.'],
 ['Chant','consigna','Frase corta para corear, a menudo en formato pregunta-respuesta.'],
 ['Call and response','pregunta-respuesta','El MC lanza una frase y el público u otros MCs responden.'],
 ['Ad-libs','apoyos','Gritos, interjecciones y palabras sueltas que acompañan las barras propias o las de otro MC.'],
 ['Flow','flow','Cómo colocas las sílabas y los acentos sobre el ritmo.'],
 ['Off the dome','improvisado','Improvisar en el momento. En grime convive con las barras escritas, que son lo habitual.'],
 ['Drop','caída','Momento de máximo impacto de un instrumental, cuando entra con toda su fuerza.'],
 ['Pullup','pull up · rewind · reload','El DJ devuelve el instrumental a un punto anterior para repetir un momento que ha provocado una reacción fuerte. Es una forma de reconocimiento.'],
 ['Wheel up','¡rueda atrás!','Lo que se grita para pedir un pullup.'],
 ['Shelling','reventar','Cuando la sala explota con una intervención.'],
 ['Trading bars','intercambiar barras','Alternarse el micro entre MCs, enlazando sin dejar caer la energía.'],
 ['Pass the mic','pasar el micro','Ceder el espacio vocal a otro MC.'],
 ['Clash','enfrentamiento','Duelo entre MCs o crews por turnos.'],
 ['Crew','crew','Grupo de MCs y DJs que actúan juntos.'],
 ['Big up','saludo','Dar reconocimiento a alguien: "big up al DJ".'],
 ['Dubplate','dubplate','Versión exclusiva de un tema para un DJ o sound concreto; también un tema que aún no ha salido y solo suena en sets.'],
 ['Soundsystem','sound system','Cultura jamaicana de equipos de sonido, selectores y MCs que convierten la música en un acontecimiento colectivo.'],
 ['BPM','pulsos por minuto','Velocidad del instrumental. El grime gira en torno a 140 (o su mitad, 70).'],
 ['UK garage','UK garage','Género británico del que sale buena parte de la primera generación del grime.'],
 ['2-step','2-step','Variante del garage con ritmos rotos y saltarines.'],
 ['Deep dubstep','deep dubstep','Dubstep oscuro y espacioso, de bajos profundos, que hoy puede sonar en un set de grime.']];
const glist=$('#glist');
function renderG(q=''){ q=q.trim().toLowerCase(); const it=G.filter(g=>!q||(g[0]+' '+g[1]+' '+g[2]).toLowerCase().includes(q));
  glist.innerHTML=it.map(g=>`<div class="gterm ${q&&g[0].toLowerCase()===q?'hit':''}"><h4>${g[0]}<em>${g[1]}</em></h4><p>${g[2]}</p></div>`).join('')||'<p class="dim">Nada encontrado.</p>'; }
function openG(q=''){ $('#gq').value=q; renderG(q); $('#drawer').classList.add('open'); }
renderG(); $('#gq').oninput=e=>renderG(e.target.value); $('#gbtn').onclick=()=>openG();
$('#gclose').onclick=()=>$('#drawer').classList.remove('open'); $('#drawer').onclick=e=>{ if(e.target.id==='drawer') $('#drawer').classList.remove('open'); };
document.addEventListener('click',e=>{ const t=e.target.closest('.term'); if(t) openG(t.dataset.t||t.textContent); });

/* ============ MOTOR DEL SLIDESHOW ============ */
const stage=$('#stage'); let cur=0, max=0;
try{ const s=JSON.parse(localStorage.getItem('barna-grime')||'{}'); max=s.max||0; }catch(e){}
const save=()=>{ try{ localStorage.setItem('barna-grime',JSON.stringify({max})); }catch(e){} };
S.forEach((s,i)=>{ const d=document.createElement('section'); d.className='slide'; d.innerHTML=`<div class="inner">${s.html}</div>`; stage.appendChild(d); s.el=d;
  $$('[data-w]',d).forEach(w=>W[w.dataset.w]&&W[w.dataset.w](w)); });
$('#segs').innerHTML=CH.slice(1).map(()=>'<i><b></b></i>').join('');
const frags=i=>$$('.f',S[i].el);
function render(){
  S.forEach((s,i)=>{ s.el.classList.toggle('on',i===cur); s.el.classList.toggle('out',i<cur); });
  const ch=S[cur].ch; $('#chap').textContent=ch?String(ch).padStart(2,'0')+' · '+CH[ch]:'';
  $$('#segs i').forEach((e,i)=>{ const c=i+1, sl=S.map((s,k)=>[s,k]).filter(([s])=>s.ch===c), done=sl.filter(([s,k])=>k<cur||(k===cur&&!frags(k).some(f=>!f.classList.contains('v')))).length;
    e.querySelector('b').style.width=(done/sl.length*100)+'%'; e.classList.toggle('cur',c===ch); });
  const fs=frags(cur), left=fs.filter(f=>!f.classList.contains('v')).length, nx=$('#next');
  $('#dots').innerHTML=fs.length?fs.map(f=>`<i class="${f.classList.contains('v')?'v':''}"></i>`).join(''):'';
  nx.classList.toggle('next',!left);
  $('#nextl').textContent= left? (cur===0&&fs.filter(f=>f.classList.contains('v')).length===0?'Empezar':'Descubrir') : cur===S.length-1?'Fin':(S[cur+1].ch!==ch?'Capítulo '+S[cur+1].ch+' ▸':'Siguiente ▸');
  nx.disabled = !left && cur===S.length-1; $('#prev').disabled=cur===0;
  if(cur>max){ max=cur; save(); }
}
function next(){ const f=frags(cur).find(f=>!f.classList.contains('v'));
  if(f){ f.classList.add('v'); setTimeout(()=>f.scrollIntoView({behavior:'smooth',block:'nearest'}),60); render(); return; }
  if(cur<S.length-1) go(cur+1); }
function prev(){ if(cur>0) go(cur-1); }
function go(i,revealAll){ cur=i; if(revealAll||i<max) frags(i).forEach(f=>f.classList.add('v')); S[i].el.scrollTop=0; render(); }
window.go=go;
function openIdx(){ const reachedCh=S[max].ch; $('#idxl').innerHTML=CH.map((c,i)=>{ if(i===0) return ''; const first=S.findIndex(s=>s.ch===i); const lock=i>reachedCh;
  return `<a href="#" data-s="${first}" class="${lock?'lock':''}"><span class="n">${String(i).padStart(2,'0')}</span><span>${c}</span><span class="s">${lock?'🔒':i<reachedCh?'✓':'en curso'}</span></a>`; }).join('');
  $$('#idxl a').forEach(a=>a.onclick=e=>{ e.preventDefault(); $('#idx').classList.remove('open'); go(+a.dataset.s); }); $('#idx').classList.add('open'); }
window.openIdx=openIdx;
$('#next').onclick=next; $('#prev').onclick=prev; $('#index').onclick=openIdx;
$('#idxc').onclick=()=>$('#idx').classList.remove('open'); $('#idx').onclick=e=>{ if(e.target.id==='idx') $('#idx').classList.remove('open'); };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); } if(e.key==='ArrowLeft') prev(); });
/* swipe (ignora gestos sobre controles) */
let sx=null,sy=0; stage.addEventListener('touchstart',e=>{ if(e.target.closest('input,button,.flip')) { sx=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); } sx=null; });
render();
</script>
